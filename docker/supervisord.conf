; =============================================================================
; supervisord config — runs nginx + php-fpm in the same container
; =============================================================================
; Render expects to see an HTTP listener; this lets nginx (port $PORT) live
; next to php-fpm (port 9000 internal FastCGI) without two containers.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ----- php-fpm ------------------------------------------------------------
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ----- nginx --------------------------------------------------------------
; `daemon off` is already set in nginx.conf itself, so just run nginx.
; (Putting `-g "daemon off;"` here caused a "duplicate daemon directive"
; error against nginx.conf line 13.)
[program:nginx]
command=/usr/sbin/nginx
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

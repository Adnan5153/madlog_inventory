# =============================================================================
# nginx config for Madlog Inventory on Render
# =============================================================================
# Listens on $PORT (Render assigns it; defaults to 10000).
# Reverse-proxies PHP requests to php-fpm on 127.0.0.1:9000.
# Serves Laravel's public/ as the document root.
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Surface PHP / Laravel errors clearly in Render's logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    # Hide nginx version on error pages.
    server_tokens off;

    # Avoid huge request bodies on a Laravel app.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    server {
        # Render injects $PORT; fall back to 10000 for local debugging.
        listen ${PORT} default_server;
        listen [::]:${PORT} default_server;
        server_name _;

        root /var/www/public;
        index index.php index.html;

        # Pretty URLs for Laravel.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Pass PHP requests to php-fpm.
        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO       $fastcgi_path_info;
            fastcgi_param  HTTPS           $https if_not_empty;
            fastcgi_read_timeout 60s;
        }

        # Don't execute PHP in upload / vendor dirs even if a file sneaks in.
        location ~* /(?:uploads|files|vendor)/.*\.php$ {
            deny all;
        }

        # Long-cache the hashed Vite assets.
        location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}

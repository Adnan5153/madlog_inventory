services:
  # ----- Postgres database ------------------------------------------------
  # Note: the service name below must match the name Render shows in the
  # dashboard for the existing psql instance. Render matches `fromService`
  # bindings by name; if these don't match, env vars are silently not
  # injected and the app boots with empty DB_* values.
  - type: psql
    name: dpg-da036lht0dsc738pcb50-a
    plan: free
    region: singapore
    ipAllowList: []  # only allow internal Render connections

  # ----- Web service (Laravel) -------------------------------------------
  # Same caveat as above — `name` must match the live web service name.
  - type: web
    name: madlog_inventory
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile

    healthCheckPath: /up

    envVars:
      # Laravel-required runtime settings
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Madlog Store
      - key: APP_URL
        fromService: { type: web, name: madlog_inventory, property: host }
      - key: APP_KEY
        generateValue: true

      # Database — Use Render's hosted Postgres. `DATABASE_URL` (via
      # `connectionString`) takes precedence inside config/database.php's
      # `url` fields, which is the cleanest way to wire Laravel to a
      # managed Postgres. The individual DB_* vars are still injected as
      # fallbacks (and so the entrypoint can log them in the .env preview).
      #
      # IMPORTANT: the `fromService` reference below is only honored by
      # Render when (a) the service name matches a live psql instance AND
      # (b) you click "Apply render.yaml" from the Blueprint page. A
      # push-to-main redeploy does NOT re-sync env vars. If you see the
      # entrypoint's "no Postgres service is wired up" FATAL after a
      # deploy, the fix is: open the madlog_inventory web service →
      # Environment tab → add `DATABASE_URL` manually with the internal
      # connection string (`postgresql://root:<pwd>@dpg-da036lht0dsc738pcb50-a/madlog`).
      # The fromService line below documents the correct wiring — just
      # not the one Render auto-applies for existing services.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: connectionString }
      - key: DB_HOST
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: host }
      - key: DB_PORT
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: port }
      - key: DB_DATABASE
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: database }
      - key: DB_USERNAME
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: user }
      - key: DB_PASSWORD
        fromService: { type: psql, name: dpg-da036lht0dsc738pcb50-a, property: password }
      # Render Postgres requires SSL; the pgsql block in config/database.php
      # already defaults sslmode to 'prefer', which is fine for the free tier.
      - key: DB_SSLMODE
        value: require

      # Sessions, cache, queue — all database-backed so we don't need
      # an extra Redis instance on Render's free tier.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Logging — Render drains stderr into its log explorer
      - key: LOG_CHANNEL
        value: stderr

      # Mail — log until a real SMTP/Resend/Postmark is wired up
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@madlogstore.test
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"

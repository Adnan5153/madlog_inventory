services:
  # ----- Postgres database ------------------------------------------------
  - type: psql
    name: madlog-store-db
    plan: free
    region: singapore
    ipAllowList: []  # only allow internal Render connections

  # ----- Web service (Laravel) -------------------------------------------
  - type: web
    name: madlog-store
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile

    healthCheckPath: /up

    envVars:
      # Laravel-required runtime settings
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Madlog Store
      - key: APP_URL
        fromService: { type: web, name: madlog-store, property: host }
      - key: APP_KEY
        generateValue: true

      # Database — Use Render's hosted Postgres. We inject the individual
      # DB_* env vars (host, port, database, username, password) from the
      # psql service so Laravel's database config (which reads DB_URL or
      # DB_HOST/DB_PORT/...) can connect without a separate URL parser.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService: { type: psql, name: madlog-store-db, property: host }
      - key: DB_PORT
        fromService: { type: psql, name: madlog-store-db, property: port }
      - key: DB_DATABASE
        fromService: { type: psql, name: madlog-store-db, property: database }
      - key: DB_USERNAME
        fromService: { type: psql, name: madlog-store-db, property: user }
      - key: DB_PASSWORD
        fromService: { type: psql, name: madlog-store-db, property: password }
      # Render Postgres requires SSL; the pgsql block in config/database.php
      # already defaults sslmode to 'prefer', which is fine for the free tier.
      - key: DB_SSLMODE
        value: require

      # Sessions, cache, queue — all database-backed so we don't need
      # an extra Redis instance on Render's free tier.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Logging — Render drains stderr into its log explorer
      - key: LOG_CHANNEL
        value: stderr

      # Mail — log until a real SMTP/Resend/Postmark is wired up
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@madlogstore.test
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"
